name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelance-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freelance-os/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelance-os/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freelance-os/server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
